name: Build InfraOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build Clean InfraOS Filesystem
        run: |
          sudo debootstrap --arch=amd64 noble ./chroot http://archive.ubuntu.com/ubuntu/
          
          # Install Python & networking utilities inside chroot
          sudo chroot ./chroot apt-get update
          sudo chroot ./chroot apt-get install -y python3 python3-pip iputils-ping net-tools python3-mysql.connector

          # Inject Custom Branding
          [ -f "assets/os-release" ] && sudo cp assets/os-release ./chroot/etc/os-release
          [ -f "assets/issue" ] && sudo cp assets/issue ./chroot/etc/issue
          
          # Inject Custom Wizard Script
          if [ -f "assets/infra-setup" ]; then
            sudo cp assets/infra-setup ./chroot/usr/local/bin/infra-setup
            sudo chmod +x ./chroot/usr/local/bin/infra-setup
            
            # Configure auto-run on first boot
            echo "python3 /usr/local/bin/infra-setup" | sudo tee -a ./chroot/etc/profile
          fi

      - name: Package ISO
        run: |
          mkdir -p image/live iso-out
          sudo mksquashfs ./chroot image/live/filesystem.squashfs -e boot
          sudo grub-mkrescue -o iso-out/InfraOS-v1.0.0.0-amd64.iso image/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraOS-v1.0.0.0-ISO
          path: iso-out/InfraOS-v1.0.0.0-amd64.iso
