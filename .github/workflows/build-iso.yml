name: Build InfraOS ISO

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag like v1.0.0.0
  workflow_dispatch: # Allows you to manually trigger the build anytime from the web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools p7zip-full

      - name: Download Base Ubuntu Server ISO
        run: |
          echo "Downloading official Ubuntu 24.04 ISO..."
          curl -L -o ubuntu-base.iso "https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso"

      - name: Extract and Inject Custom Branding
        run: |
          mkdir -p extracted iso-out
          # Extract ISO contents
          xorriso -osirrox on -indev ubuntu-base.iso -extract / extracted
          chmod -R +w extracted

          # Inject custom os-release metadata
          if [ -f "assets/os-release" ]; then
            cp assets/os-release extracted/etc/os-release
          fi

          # Inject custom issue login banner
          if [ -f "assets/issue" ]; then
            cp assets/issue extracted/etc/issue
          fi

          # Inject product key CLI utility
          if [ -f "assets/infra-key" ]; then
            cp assets/infra-key extracted/usr/local/bin/infra-key
            chmod +x extracted/usr/local/bin/infra-key
          fi

      - name: Repackage InfraOS ISO
        run: |
          xorriso -as mkisofs -r \
            -V "INFRAOS_V1" \
            -J -joliet-long \
            -b boot/grub/i386-pc/eltorito.img \
            -c boot.catalog \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e EFI/boot/bootx64.efi \
            -no-emul-boot \
            -o iso-out/InfraOS-v1.0.0.0-amd64.iso extracted/

      - name: Upload ISO Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: iso-out/InfraOS-v1.0.0.0-amd64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
