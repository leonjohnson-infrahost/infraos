name: Build InfraOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools

      - name: Download Base Ubuntu Server ISO
        run: |
          echo "Downloading official Ubuntu 24.04 ISO..."
          curl -L -o ubuntu-base.iso "https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso"

      - name: Extract ISO
        run: |
          mkdir -p extracted
          xorriso -osirrox on -indev ubuntu-base.iso -extract / extracted
          chmod -R +w extracted

      - name: Inject Custom InfraOS Branding
        run: |
          if [ -f "assets/os-release" ]; then
            cp assets/os-release extracted/etc/os-release
          fi

          if [ -f "assets/issue" ]; then
            cp assets/issue extracted/etc/issue
          fi

          if [ -f "assets/infra-key" ]; then
            cp assets/infra-key extracted/usr/local/bin/infra-key
            chmod +x extracted/usr/local/bin/infra-key
          fi

      - name: Build InfraOS Bootable ISO
        run: |
          mkdir -p iso-out
          xorriso -as mkisofs \
            -r -V "INFRAOS_V1" \
            -J -joliet-long \
            -b boot/grub/i386-pc/eltorito.img \
            -c boot.catalog \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -o iso-out/InfraOS-v1.0.0.0-amd64.iso extracted/

      - name: Upload ISO as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraOS-v1.0.0.0-ISO
          path: iso-out/InfraOS-v1.0.0.0-amd64.iso
          retention-days: 7
