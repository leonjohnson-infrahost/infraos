name: Build InfraOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build Clean InfraOS Filesystem
        run: |
          sudo debootstrap --arch=amd64 noble ./chroot http://archive.ubuntu.com/ubuntu/
          
          # Inject Custom Branding
          if [ -f "assets/os-release" ]; then
            sudo cp assets/os-release ./chroot/etc/os-release
          fi
          if [ -f "assets/issue" ]; then
            sudo cp assets/issue ./chroot/etc/issue
          fi
          if [ -f "assets/infra-key" ]; then
            sudo cp assets/infra-key ./chroot/usr/local/bin/infra-key
            sudo chmod +x ./chroot/usr/local/bin/infra-key
          fi

      - name: Package ISO
        run: |
          mkdir -p image/live iso-out
          sudo mksquashfs ./chroot image/live/filesystem.squashfs -e boot
          
          # Create bootable ISO structure
          sudo grub-mkrescue -o iso-out/InfraOS-v1.0.0.0-amd64.iso image/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraOS-v1.0.0.0-ISO
          path: iso-out/InfraOS-v1.0.0.0-amd64.iso
